/* =============================================================================
   2. 색상 스케일 (RdYlBu 계열을 뒤집어 사용: 낮음=파랑 -> 중간=연두/노랑 -> 높음=주황/빨강)
   ============================================================================= */
const COLOR_STOPS = [
  [49, 54, 149],    // 0.0  진한 파랑 (가장 낮은 기온)
  [69, 117, 180],
  [116, 173, 209],
  [171, 217, 233],
  [224, 243, 248],
  [255, 255, 191],  // 0.5  연노랑 (중간)
  [254, 224, 144],
  [253, 174, 97],
  [244, 109, 67],
  [215, 48, 39],
  [165, 0, 38]      // 1.0  진한 빨강 (가장 높은 기온)
];

// 정규화된 값(0~1)을 받아 RGB 배열을 반환 (선형 보간)
function valueToColor(t) {
  t = Math.min(1, Math.max(0, t));
  const n = COLOR_STOPS.length - 1;
  const scaled = t * n;
  const idx = Math.min(n - 1, Math.floor(scaled));
  const frac = scaled - idx;
  const c0 = COLOR_STOPS[idx];
  const c1 = COLOR_STOPS[idx + 1];
  return [
    Math.round(c0[0] + (c1[0] - c0[0]) * frac),
    Math.round(c0[1] + (c1[1] - c0[1]) * frac),
    Math.round(c0[2] + (c1[2] - c0[2]) * frac)
  ];
}

/* =============================================================================
   3. 격자 데이터를 Canvas 픽셀로 변환 -> 이미지(dataURL) 생성
      (연도별로 1회씩만 계산해 두고, 연도 전환 시에는 이미지를 교체만 함 -> 매우 빠름)
   ============================================================================= */
const { nx, ny, lon_min, lon_max, lat_min, lat_max } = INTERP_DATA.grid;
const vmin = INTERP_DATA.vmin;
const vmax = INTERP_DATA.vmax;

function buildOverlayImage(yearKey) {
  const values = INTERP_DATA.years[yearKey];
  const canvas = document.createElement('canvas');
  canvas.width = nx;
  canvas.height = ny;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(nx, ny);

  for (let row = 0; row < ny; row++) {
    // 격자는 위도 낮은 값(남쪽)부터 저장되어 있으므로, 이미지 좌표계(위->아래)에 맞춰 y를 뒤집는다
    const srcRow = ny - 1 - row;
    for (let col = 0; col < nx; col++) {
      const v = values[srcRow * nx + col];
      const pixelIdx = (row * nx + col) * 4;
      if (v === null) {
        imgData.data[pixelIdx + 3] = 0; // 대한민국 영역 밖 -> 완전 투명
      } else {
        const t = (v - vmin) / (vmax - vmin);
        const [r, g, b] = valueToColor(t);
        imgData.data[pixelIdx] = r;
        imgData.data[pixelIdx + 1] = g;
        imgData.data[pixelIdx + 2] = b;
        imgData.data[pixelIdx + 3] = 225; // 약간의 투명도로 지도 배경과 자연스럽게 합성
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas.toDataURL();
}

// 3개 연도의 오버레이 이미지를 미리 한 번씩 생성해 캐시해 둔다
const overlayImages = {};
['2025', '2030', '2040'].forEach(y => { overlayImages[y] = buildOverlayImage(y); });

/* =============================================================================
   4. Leaflet 지도 초기화
   ============================================================================= */
const map = L.map('map', { zoomControl: true }).setView([36.4, 127.8], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 12,
  opacity: 0.55
}).addTo(map);

const bounds = [[lat_min, lon_min], [lat_max, lon_max]];

let currentOverlay = L.imageOverlay(overlayImages['2025'], bounds, {
  opacity: 0.85,
  interactive: false
}).addTo(map);

// 국경 외곽선 (참고용 시각적 경계)
const borderLayer = L.layerGroup(
  BORDER_RINGS.map(ring => L.polygon(ring, {
    color: '#374151', weight: 1, fill: false, opacity: 0.6
  }))
).addTo(map);

/* =============================================================================
   5. 5개 관측지점 마커 + 팝업 + 라벨
   ============================================================================= */
let currentYear = '2025';
const stationMarkers = {};

Object.entries(INTERP_DATA.stations).forEach(([name, info]) => {
  const marker = L.circleMarker([info.lat, info.lon], {
    radius: 7,
    color: '#111827',
    weight: 2,
    fillColor: '#ffffff',
    fillOpacity: 1
  }).addTo(map);

  marker.bindTooltip('', { permanent: true, direction: 'top', offset: [0, -8], className: 'station-tooltip' });
  marker.bindPopup('');

  stationMarkers[name] = { marker, info };
});

function refreshStationLabels(yearKey) {
  Object.entries(stationMarkers).forEach(([name, { marker, info }]) => {
    const temp = info.temps[yearKey];
    marker.setTooltipContent(`${name} ${temp.toFixed(1)}℃`);
    marker.setPopupContent(
      `<b>${name}</b><br>` +
      `연도: ${yearKey}년<br>` +
      `평균기온: ${temp.toFixed(1)}℃<br>` +
      `위도: ${info.lat.toFixed(4)}, 경도: ${info.lon.toFixed(4)}`
    );
  });
}
refreshStationLabels(currentYear);

/* =============================================================================
   6. 범례(legend) 컨트롤
   ============================================================================= */
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-title">연평균기온 (℃)</div>
    <div class="gradient-bar"></div>
    <div class="scale-labels">
      <span>낮음 (${vmin.toFixed(1)}℃)</span>
      <span>높음 (${vmax.toFixed(1)}℃)</span>
    </div>
  `;
  return div;
};
legend.addTo(map);

/* =============================================================================
   7. 연도 선택 UI 이벤트 처리
      -> 버튼 클릭 시: 미리 만들어둔 오버레이 이미지로 즉시 교체 (재계산 없음)
   ============================================================================= */
const yearButtons = document.querySelectorAll('.year-btn');
const yearBadge = document.getElementById('year-badge');

yearButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const year = btn.dataset.year;
    if (year === currentYear) return;
    currentYear = year;

    // 버튼 활성화 상태 갱신
    yearButtons.forEach(b => b.classList.toggle('active', b.dataset.year === year));
    yearBadge.textContent = year + '년';

    // 온도 표면 이미지 교체
    map.removeLayer(currentOverlay);
    currentOverlay = L.imageOverlay(overlayImages[year], bounds, {
      opacity: 0.85,
      interactive: false
    }).addTo(map);
    currentOverlay.bringToFront();
    borderLayer.eachLayer(l => l.bringToFront());
    Object.values(stationMarkers).forEach(({ marker }) => marker.bringToFront());

    // 관측지점 라벨/팝업 갱신
    refreshStationLabels(year);
  });
});
</script>
</body>
</html>
